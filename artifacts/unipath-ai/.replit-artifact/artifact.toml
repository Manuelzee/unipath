kind = "web"
previewPath = "/"
title = "UniPath AI"
description = "A mobile-friendly university discovery and application-planning app that helps students compare schools worldwide, save options, and organize application steps using clearly labeled sample data."
version = "1.0.0"
id = "artifacts/unipath-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23587

[services.development]
run = "pnpm --filter @workspace/unipath-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/unipath-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/unipath-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23587"
BASE_PATH = "/"
