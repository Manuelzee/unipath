# Backup keep-awake ping. The main one runs inside the database (Supabase
# pg_cron + pg_net, scheduled by the API at start-up; see
# apps/api/src/lib/keepAwake.ts) because GitHub runs these schedules very
# irregularly (2 runs in 28 hours in practice). Render's free plan stops the
# API after 15 minutes without traffic; the readiness check below also runs a
# tiny database query, which keeps the free Supabase project from pausing.
#
# Notes: one always-on free service uses about 744 of Render's 750 free hours a
# month, so add no other free Render services while this runs. GitHub may delay
# scheduled runs and turns them off after 60 days without repository activity
# (re-enable under Actions). Delete this file to stop the pings.
name: Keep the API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping the API readiness check
        run: >-
          curl --silent --show-error --fail --max-time 90
          --retry 3 --retry-delay 15 --retry-all-errors
          https://unipath-api-pc1d.onrender.com/api/readyz
