# Render Blueprint for the UniPath API. In Render: New > Blueprint, choose this
# repository. Render asks for each value marked `sync: false`.
# Full walkthrough: docs/deployment.md
services:
  - type: web
    name: unipath-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # Installs everything (the build tools are dev dependencies), bundles the
    # API, checks the database connection (printing the cause if it fails),
    # then applies additive schema changes to DATABASE_URL. A schema change
    # that could lose data stops the build instead of being applied.
    buildCommand: >-
      NODE_ENV=development npx -y pnpm@10.34.9 install --frozen-lockfile &&
      npx -y pnpm@10.34.9 --filter @workspace/api-server run build &&
      npx -y pnpm@10.34.9 db:check &&
      npx -y pnpm@10.34.9 db:push
    startCommand: node --enable-source-maps apps/api/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render terminates HTTPS in front of the app.
      - key: TRUST_PROXY
        value: "1"
      # Supabase session pooler URI ending in ?sslmode=require&uselibpqcompat=true
      - key: DATABASE_URL
        sync: false
      # The Cloudflare Pages site, e.g. https://unipath.pages.dev
      - key: APP_ORIGIN
        sync: false
      # Resend API key with Sending access, limited to the verified domain.
      - key: RESEND_API_KEY
        sync: false
      # e.g. UniPath AI <no-reply@your-domain>
      - key: EMAIL_FROM
        sync: false
      # Random value generated by Render; copy it to the Cloudflare Pages project.
      - key: PROXY_SHARED_SECRET
        generateValue: true
