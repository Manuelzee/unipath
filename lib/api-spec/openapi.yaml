openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: universities
    description: International institution directory with source-limited coverage
  - name: student
    description: Signed-in student profile, saved schools, and application tasks
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /universities:
    get:
      operationId: listUniversities
      tags: [universities]
      summary: Search imported institutions worldwide
      parameters:
        - in: query
          name: countryCode
          schema: { type: string, pattern: "^[A-Z]{2}$" }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: language
          schema: { type: string }
        - in: query
          name: applicantStatus
          schema: { type: string, enum: [Domestic, International] }
        - in: query
          name: fundingOnly
          schema: { type: boolean, default: false }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: state
          schema: { type: string }
        - in: query
          name: institutionType
          schema: { type: string }
        - in: query
          name: ownership
          schema: { type: string }
        - in: query
          name: degreeLevel
          schema: { type: string }
        - in: query
          name: major
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        "200":
          description: Matching active institutions from the NCES IPEDS and College Scorecard datasets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListUniversitiesResult" }
  /universities/filters:
    get:
      operationId: getUniversityFilterOptions
      tags: [universities]
      summary: Get directory filter values from the imported institution database
      responses:
        "200":
          description: Available institution types, ownerships, degrees, and majors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UniversityFilterOptions" }
  /universities/coverage:
    get:
      operationId: getDirectoryCoverage
      tags: [universities]
      summary: Get tested country coverage and source access restrictions
      responses:
        "200":
          description: Actual imported coverage, not a claim of national completeness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryCoverage" }
  /university-facts:
    get:
      operationId: listUniversityFacts
      tags: [universities]
      summary: Browse source-reported programs, admissions and funding
      parameters:
        - in: query
          name: institutionId
          required: true
          schema: { type: string }
        - in: query
          name: kind
          schema: { type: string, enum: [program, admissions, funding], default: program }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Paginated imported facts; absent facts are never inferred
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstitutionFactPage" }
        "404": { description: Institution not found }
  /funding/matches:
    post:
      operationId: getFundingMatches
      tags: [universities]
      summary: Find potential source-verified funding opportunities for a student
      description: Evaluates only recent, independently verified institutional funding records. Student inputs are held in memory for this request and are not stored or sent to external services. A match is a potential lead, never a guarantee of award or eligibility.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FundingStudentProfileInput"
      responses:
        "200":
          description: Source-linked potential opportunities; never a promise of eligibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingMatchResponse"
  /funding/options:
    get:
      operationId: getFundingFinderOptions
      tags: [universities]
      summary: Get source-supported choices for the student funding finder
      responses:
        "200":
          description: Filters derived from recently verified imported opportunity records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingFinderOptions"
  /universities/{id}:
    get:
      operationId: getUniversity
      tags: [universities]
      summary: Get a college or university listing
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Institution directory record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/University" }
        "404": { description: University not found }
  /me/profile:
    get:
      operationId: getStudentProfile
      tags: [student]
      summary: Get the signed-in student's profile
      responses:
        "200":
          description: Student profile or null when not completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentProfileResult" }
        "401": { description: Sign in required }
    put:
      operationId: saveStudentProfile
      tags: [student]
      summary: Save the signed-in student's profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentProfileInput" }
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentProfile" }
        "401": { description: Sign in required }
  /me/saved:
    get:
      operationId: listSavedUniversities
      tags: [student]
      summary: List saved universities for the signed-in student
      responses:
        "200":
          description: Saved university listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SavedUniversity" }
        "401": { description: Sign in required }
    post:
      operationId: saveUniversity
      tags: [student]
      summary: Save a university to the student's list
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveUniversityInput" }
      responses:
        "201":
          description: Saved university
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedUniversity" }
        "401": { description: Sign in required }
  /me/saved/{universityId}:
    delete:
      operationId: removeSavedUniversity
      tags: [student]
      summary: Remove a saved university
      parameters:
        - in: path
          name: universityId
          required: true
          schema: { type: string }
      responses:
        "204": { description: University removed }
        "401": { description: Sign in required }
  /me/tasks:
    get:
      operationId: listApplicationTasks
      tags: [student]
      summary: List application tasks
      responses:
        "200":
          description: Tasks for the signed-in student
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApplicationTask" }
        "401": { description: Sign in required }
    post:
      operationId: createApplicationTask
      tags: [student]
      summary: Create an application task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationTaskInput" }
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationTask" }
        "401": { description: Sign in required }
  /me/tasks/{id}:
    patch:
      operationId: updateApplicationTask
      tags: [student]
      summary: Update a task or mark it complete
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationTaskUpdate" }
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationTask" }
        "401": { description: Sign in required }
        "404": { description: Task not found }
    delete:
      operationId: deleteApplicationTask
      tags: [student]
      summary: Delete a task
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Task deleted }
        "401": { description: Sign in required }
        "404": { description: Task not found }
  /me/dashboard:
    get:
      operationId: getStudentDashboard
      tags: [student]
      summary: Get application dashboard summary
      responses:
        "200":
          description: Summary for the signed-in student
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
        "401": { description: Sign in required }
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    University:
      type: object
      required: [id, name, country, countryCode, city, state, institutionType, ownership, dataSource, dataYear, degreeLevels, degreeTypes, majors, website, admissionsWebsite, applicationWebsite, financialAidWebsite, admissionRate, admissionRateYear, completionRate, completionRateYear, completionRateType, pellGrantRate, pellGrantRateYear, medianDebtUsd, medianDebtYear, sourceUrl, isActive, lastUpdatedAt, sourceScope, sourceLicenseUrl, recognitionStatus, languages, applicantStatuses, dliNumber, dliSourceUrl, dliVerifiedAt, lastVerifiedAt]
      properties:
        id: { type: string }
        name: { type: string }
        country: { type: string }
        countryCode: { type: string }
        sourceScope: { type: ["string", "null"] }
        sourceLicenseUrl: { type: ["string", "null"] }
        recognitionStatus: { type: ["string", "null"] }
        languages: { type: array, items: { type: string } }
        applicantStatuses: { type: array, items: { type: string } }
        dliNumber: { type: ["string", "null"] }
        dliSourceUrl: { type: ["string", "null"] }
        dliVerifiedAt: { type: ["string", "null"], format: date-time }
        lastVerifiedAt: { type: ["string", "null"], format: date-time }
        city: { type: string }
        state: { type: string }
        institutionType: { type: string }
        ownership: { type: ["string", "null"] }
        dataSource: { type: string }
        dataYear: { type: ["string", "null"] }
        degreeLevels:
          type: array
          items: { type: string }
        degreeTypes:
          type: array
          items: { type: string }
        majors:
          type: array
          items: { type: string }
        website: { type: ["string", "null"] }
        admissionsWebsite: { type: ["string", "null"] }
        applicationWebsite: { type: ["string", "null"] }
        financialAidWebsite: { type: ["string", "null"] }
        admissionRate: { type: ["number", "null"] }
        admissionRateYear: { type: ["integer", "null"] }
        completionRate: { type: ["number", "null"] }
        completionRateYear: { type: ["integer", "null"] }
        completionRateType: { type: ["string", "null"] }
        pellGrantRate: { type: ["number", "null"] }
        pellGrantRateYear: { type: ["integer", "null"] }
        medianDebtUsd: { type: ["integer", "null"] }
        medianDebtYear: { type: ["integer", "null"] }
        sourceUrl: { type: string }
        isActive: { type: boolean }
        lastUpdatedAt: { type: string, format: date-time }
    UniversityFilterOptions:
      type: object
      required: [institutionTypes, ownerships, degreeLevels, majors, countries, regions, languages, applicantStatuses]
      properties:
        countries:
          type: array
          items:
            $ref: "#/components/schemas/CountryOption"
        regions:
          type: array
          items: { $ref: "#/components/schemas/RegionOption" }
        languages: { type: array, items: { type: string } }
        applicantStatuses: { type: array, items: { type: string } }
        institutionTypes:
          type: array
          items: { type: string }
        ownerships:
          type: array
          items: { type: string }
        degreeLevels:
          type: array
          items: { type: string }
        majors:
          type: array
          items: { type: string }
    CountryOption:
      type: object
      required: [code, name, count]
      properties:
        code: { type: string }
        name: { type: string }
        count: { type: integer }
    RegionOption:
      type: object
      required: [countryCode, code]
      properties:
        countryCode: { type: string }
        code: { type: string }
    CountryCoverage:
      type: object
      required: [countryCode, country, institutionCount, programCount, status, note, lastImportedAt]
      properties:
        countryCode: { type: string }
        country: { type: string }
        institutionCount: { type: integer }
        programCount: { type: integer }
        status: { type: string }
        note: { type: string }
        lastImportedAt: { type: ["string", "null"], format: date-time }
    DirectoryCoverage:
      type: object
      required: [countries, worldwideNote, references]
      properties:
        countries:
          type: array
          items: { $ref: "#/components/schemas/CountryCoverage" }
        worldwideNote: { type: string }
        references:
          type: array
          items: { $ref: "#/components/schemas/DirectoryReference" }
    DirectoryReference:
      type: object
      required: [name, url, termsUrl, access]
      properties:
        name: { type: string }
        url: { type: string }
        termsUrl: { type: string }
        access: { type: string }
    InstitutionFact:
      type: object
      required: [id, institutionId, kind, title, fieldsOfStudy, degreeLevel, language, programType, applicantStatuses, requirements, eligibility, applicantGroup, admissionScope, fundingCategory, awardAmount, eligibleCitizenships, eligibleResidenceCountries, eligibleResidenceRegions, eligibleDegreeLevels, eligibleMajors, majorRequirement, eligibleCriteria, minimumGpa, minimumGpaScale, deadline, officialUrl, sourceName, sourceUrl, sourceDate, sourceLicenseUrl, lastVerifiedAt, importedAt]
      properties:
        id: { type: string }
        institutionId: { type: string }
        kind: { type: string, enum: [program, admissions, funding] }
        title: { type: string }
        fieldsOfStudy: { type: array, items: { type: string } }
        degreeLevel: { type: ["string", "null"] }
        language: { type: ["string", "null"] }
        programType: { type: ["string", "null"] }
        applicantStatuses: { type: array, items: { type: string } }
        requirements: { type: array, items: { type: string } }
        eligibility: { type: ["string", "null"] }
        applicantGroup: { type: ["string", "null"], enum: [general, first-year, transfer, international, graduate, program-specific, null] }
        admissionScope: { type: ["string", "null"], enum: [school-general, program-specific, null] }
        fundingCategory: { type: ["string", "null"], enum: [merit, need-based-grant, institutional, federal, state, international, transfer, graduate, athletic, talent-based, work-study, assistantship, fellowship, research, other, null] }
        awardAmount: { type: ["string", "null"], maxLength: 240 }
        eligibleCitizenships: { type: array, items: { type: string } }
        eligibleResidenceCountries: { type: array, items: { type: string } }
        eligibleResidenceRegions: { type: array, items: { type: string } }
        eligibleDegreeLevels: { type: array, items: { type: string } }
        eligibleMajors: { type: array, items: { type: string } }
        majorRequirement: { type: ["string", "null"], enum: [required, not_restricted, null] }
        eligibleCriteria: { type: array, items: { type: string } }
        minimumGpa: { type: ["number", "null"], minimum: 0, maximum: 4 }
        minimumGpaScale: { type: ["string", "null"], enum: ["4.0", null] }
        deadline: { type: ["string", "null"], format: date }
        officialUrl: { type: ["string", "null"] }
        sourceName: { type: string }
        sourceUrl: { type: string }
        sourceDate: { type: ["string", "null"] }
        sourceLicenseUrl: { type: ["string", "null"] }
        lastVerifiedAt: { type: ["string", "null"], format: date-time }
        importedAt: { type: string, format: date-time }
    InstitutionFactPage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InstitutionFact" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    FundingStudentProfileInput:
      type: object
      additionalProperties: false
      required: []
      properties:
        applicantStatus: { type: string, enum: [Domestic, International] }
        applicantGroup:
          type: string
          enum: [first-year, transfer, graduate, other]
        citizenship: { type: string, pattern: "^[A-Za-z]{2}$" }
        residenceCountry: { type: string, pattern: "^[A-Za-z]{2}$" }
        residenceRegion: { type: string, maxLength: 16 }
        intendedMajor: { type: string, maxLength: 160 }
        degreeLevel: { type: string, maxLength: 100 }
        gpa:
          type: number
          minimum: 0
          maximum: 4
          description: Optional U.S. 4.0-scale GPA; other grading scales are not converted.
        criteria:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, maxLength: 100 }
        page: { type: integer, minimum: 1, maximum: 100000 }
        pageSize: { type: integer, minimum: 1, maximum: 50 }
    FundingPotentialMatch:
      type: object
      required: [institutionId, institutionName, countryCode, city, opportunity, matchedCriteria, unconfirmedCriteria, deadlineStatus]
      properties:
        institutionId: { type: string }
        institutionName: { type: string }
        countryCode: { type: string }
        city: { type: string }
        opportunity:
          $ref: "#/components/schemas/InstitutionFact"
        matchedCriteria: { type: array, items: { type: string } }
        unconfirmedCriteria: { type: array, items: { type: string } }
        deadlineStatus:
          type: string
          enum: [Unknown, Source-reported date, Expired]
    FundingMatchResponse:
      type: object
      required: [matches, matchCount, page, pageSize, totalPages, verifiedRecordCount, unverifiedRecordCount, expiredRecordCount, notice]
      properties:
        matches:
          type: array
          items: { $ref: "#/components/schemas/FundingPotentialMatch" }
        matchCount: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 50 }
        totalPages: { type: integer, minimum: 0 }
        verifiedRecordCount: { type: integer }
        unverifiedRecordCount: { type: integer }
        expiredRecordCount: { type: integer }
        notice: { type: string }
    FundingFinderOptions:
      type: object
      required: [verifiedOpportunityCount, unverifiedOpportunityCount, expiredOpportunityCount, applicantGroups, applicantStatuses, citizenships, residenceCountries, residenceRegions, degreeLevels, criteria, verificationWindowDays]
      properties:
        verifiedOpportunityCount: { type: integer }
        unverifiedOpportunityCount: { type: integer }
        expiredOpportunityCount: { type: integer }
        applicantGroups:
          type: array
          items: { type: string }
        applicantStatuses:
          type: array
          items: { type: string, enum: [Domestic, International] }
        citizenships:
          type: array
          items: { type: string, pattern: "^[A-Z]{2}$" }
        residenceCountries:
          type: array
          items: { type: string, pattern: "^[A-Z]{2}$" }
        residenceRegions:
          type: array
          items: { type: string, maxLength: 16 }
        degreeLevels:
          type: array
          items: { type: string }
        criteria:
          type: array
          items: { type: string, maxLength: 100 }
        verificationWindowDays: { type: integer }
    ListUniversitiesResult:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/University" }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    StudentProfileInput:
      type: object
      required: [residenceCountry, citizenship, studyCountry, degreeLevel, major, grades, annualBudgetUsd, preferredLanguage, englishTest, englishScore]
      properties:
        residenceCountry: { type: string }
        citizenship: { type: string }
        studyCountry: { type: string }
        degreeLevel: { type: string }
        major: { type: string }
        grades: { type: string }
        annualBudgetUsd: { type: number }
        preferredLanguage: { type: string }
        englishTest: { type: string }
        englishScore: { type: string }
    StudentProfile:
      allOf:
        - $ref: "#/components/schemas/StudentProfileInput"
        - type: object
          required: [updatedAt]
          properties:
            updatedAt: { type: string }
    StudentProfileResult:
      type: object
      required: [profile]
      properties:
        profile:
          anyOf:
            - $ref: "#/components/schemas/StudentProfile"
            - type: "null"
    SaveUniversityInput:
      type: object
      required: [universityId]
      properties:
        universityId: { type: string }
    SavedUniversity:
      type: object
      required: [universityId, savedAt, university]
      properties:
        universityId: { type: string }
        savedAt: { type: string }
        university: { $ref: "#/components/schemas/University" }
    ApplicationTaskInput:
      type: object
      required: [title, dueDate, universityId]
      properties:
        title: { type: string, minLength: 1 }
        dueDate: { type: string }
        universityId: { type: string }
    ApplicationTaskUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        dueDate: { type: string }
        universityId: { type: string }
        completed: { type: boolean }
    ApplicationTask:
      type: object
      required: [id, title, dueDate, universityId, completed, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        dueDate: { type: string }
        universityId: { type: string }
        completed: { type: boolean }
        createdAt: { type: string }
    DashboardSummary:
      type: object
      required: [savedCount, openTasks, completedTasks, upcomingTasks]
      properties:
        savedCount: { type: integer }
        openTasks: { type: integer }
        completedTasks: { type: integer }
        upcomingTasks:
          type: array
          items: { $ref: "#/components/schemas/ApplicationTask" }

