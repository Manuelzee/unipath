openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: universities
    description: International institution directory with source-limited coverage
  - name: student
    description: Signed-in student profile, saved schools, and application tasks
  - name: jobs
    description: Student employment guidance and job tracking
paths:
  /universities/{id}/verification:
    get:
      operationId: getPublicInstitutionVerification
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Reviewed non-price field evidence only; no reviewer identities or private jobs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicInstitutionVerification" }
  /me/admin-access:
    get:
      operationId: getAdminAccess
      responses:
        "200":
          description: Signed-in user's server-checked access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccess" }
  /me/admin-setup:
    post:
      operationId: confirmAdminSetup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminSetupConfirmation" }
      responses:
        "200":
          description: Explicit owner-confirmed server-side setup
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAccess" }
  /admin/status:
    get:
      operationId: getAdminStatus
      responses:
        "200":
          description: Actual connected database aggregates, never another environment's inferred status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDatabaseStatus" }
  /admin/institutions:
    get:
      operationId: listAdminInstitutions
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 160 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Real paginated institution records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminInstitutionList" }
  /admin/institutions/{id}:
    get:
      operationId: getAdminInstitution
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Source evidence, latest attempts and review queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminInstitutionDetail" }
  /admin/institutions/{id}/checks:
    post:
      operationId: runAdminInstitutionCheck
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Completed source check; supported claims still require review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVerificationJob" }
  /admin/checks/{id}/retry:
    post:
      operationId: retryAdminInstitutionCheck
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: A new auditable attempt, never a fabricated success
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVerificationJob" }
  /admin/proposals/{id}/review:
    post:
      operationId: reviewAdminProposal
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminProposalDecision" }
      responses:
        "200":
          description: Reviewed proposal or explicit stale-data conflict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminVerificationProposal" }
  /universities/branding-coverage:
    get:
      operationId: getInstitutionBrandingCoverage
      responses:
        "200":
          description: Actual verified branding counts, not a full-coverage claim.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstitutionBrandingCoverage" }
  /institution-branding/images/{file}:
    get:
      operationId: getInstitutionBrandingImage
      parameters:
        - in: path
          name: file
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}\.webp$' }
      responses:
        "200":
          description: Cached image with verified institution association and permitted reuse.
          content:
            image/webp:
              schema: { type: string, format: binary }
        "404": { description: No verified image is available. }
  /institution-logos/{file}:
    get:
      operationId: getInstitutionLogoImage
      parameters:
        - in: path
          name: file
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}\.webp$' }
      responses:
        "200":
          description: Immutable verified WebP logo cached in App Storage.
          content:
            image/webp:
              schema: { type: string, format: binary }
        "304": { description: Cached image has not changed. }
        "404": { description: No verified image is available. }
  /universities/logo-coverage:
    get:
      operationId: getInstitutionLogoCoverage
      responses:
        "200":
          description: Actual logo verification coverage by country and status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstitutionLogoCoverage" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /universities:
    get:
      operationId: listUniversities
      tags: [universities]
      summary: Search imported institutions worldwide
      parameters:
        - in: query
          name: countryCode
          schema: { type: string, pattern: "^[A-Z]{2}$" }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: language
          schema: { type: string }
        - in: query
          name: applicantStatus
          schema: { type: string, enum: [Domestic, International] }
        - in: query
          name: fundingOnly
          schema: { type: boolean, default: false }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: state
          schema: { type: string }
        - in: query
          name: institutionType
          schema: { type: string }
        - in: query
          name: ownership
          schema: { type: string }
        - in: query
          name: degreeLevel
          schema: { type: string }
        - in: query
          name: major
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
      responses:
        "200":
          description: Matching active institutions from the NCES IPEDS and College Scorecard datasets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListUniversitiesResult" }
  /universities/filters:
    get:
      operationId: getUniversityFilterOptions
      tags: [universities]
      summary: Get directory filter values from the imported institution database
      responses:
        "200":
          description: Available institution types, ownerships, degrees, and majors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UniversityFilterOptions" }
  /universities/coverage:
    get:
      operationId: getDirectoryCoverage
      tags: [universities]
      summary: Get tested country coverage and source access restrictions
      responses:
        "200":
          description: Actual imported coverage, not a claim of national completeness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryCoverage" }
  /university-facts:
    get:
      operationId: listUniversityFacts
      tags: [universities]
      summary: Browse source-reported programs, admissions and funding
      parameters:
        - in: query
          name: institutionId
          required: true
          schema: { type: string }
        - in: query
          name: kind
          schema: { type: string, enum: [program, admissions, funding], default: program }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Paginated imported facts; absent facts are never inferred
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstitutionFactPage" }
        "404": { description: Institution not found }
  /funding/matches:
    post:
      operationId: getFundingMatches
      tags: [universities]
      summary: Find potential source-verified funding opportunities for a student
      description: Evaluates only recent, independently verified institutional funding records. Student inputs are held in memory for this request and are not stored or sent to external services. A match is a potential lead, never a guarantee of award or eligibility.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FundingStudentProfileInput"
      responses:
        "200":
          description: Source-linked potential opportunities; never a promise of eligibility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingMatchResponse"
  /funding/options:
    get:
      operationId: getFundingFinderOptions
      tags: [universities]
      summary: Get source-supported choices for the student funding finder
      responses:
        "200":
          description: Filters derived from recently verified imported opportunity records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingFinderOptions"
  /universities/{id}:
    get:
      operationId: getUniversity
      tags: [universities]
      summary: Get a college or university listing
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Institution directory record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/University" }
        "404": { description: University not found }
  /me/recommendations:
    get:
      operationId: getStudentRecommendations
      tags: [student]
      summary: Explainable preference recommendations using the account's saved questionnaire
      responses:
        "200":
          description: Estimated matches with explicit missing evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendationResult" }
        "401": { description: Sign in required }
        "409": { description: Save a profile first }
        "503": { description: Matching data unavailable }
  /me/profile:
    get:
      operationId: getStudentProfile
      tags: [student]
      summary: Get the signed-in student's profile
      responses:
        "200":
          description: Student profile or null when not completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentProfileResult" }
        "401": { description: Sign in required }
    put:
      operationId: saveStudentProfile
      tags: [student]
      summary: Save the signed-in student's profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StudentProfileInput" }
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StudentProfile" }
        "401": { description: Sign in required }
  /me/saved:
    get:
      operationId: listSavedUniversities
      tags: [student]
      summary: List saved universities for the signed-in student
      responses:
        "200":
          description: Saved university listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SavedUniversity" }
        "401": { description: Sign in required }
    post:
      operationId: saveUniversity
      tags: [student]
      summary: Save a university to the student's list
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveUniversityInput" }
      responses:
        "201":
          description: Saved university
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedUniversity" }
        "401": { description: Sign in required }
  /me/saved/{universityId}:
    delete:
      operationId: removeSavedUniversity
      tags: [student]
      summary: Remove a saved university
      parameters:
        - in: path
          name: universityId
          required: true
          schema: { type: string }
      responses:
        "204": { description: University removed }
        "401": { description: Sign in required }
  /me/tasks:
    get:
      operationId: listApplicationTasks
      tags: [student]
      summary: List application tasks
      responses:
        "200":
          description: Tasks for the signed-in student
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApplicationTask" }
        "401": { description: Sign in required }
    post:
      operationId: createApplicationTask
      tags: [student]
      summary: Create an application task
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationTaskInput" }
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationTask" }
        "401": { description: Sign in required }
  /me/tasks/{id}:
    patch:
      operationId: updateApplicationTask
      tags: [student]
      summary: Update a task or mark it complete
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationTaskUpdate" }
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationTask" }
        "401": { description: Sign in required }
        "404": { description: Task not found }
    delete:
      operationId: deleteApplicationTask
      tags: [student]
      summary: Delete a task
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Task deleted }
        "401": { description: Sign in required }
        "404": { description: Task not found }
  /student-jobs/guidance:
    get:
      operationId: getWorkGuidance
      tags: [jobs]
      summary: Official student work-rule sources by country
      responses:
        "200":
          description: Official sources with the time each link was last fetched
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkGuidance" }
  /me/jobs:
    get:
      operationId: listJobApplications
      tags: [jobs]
      summary: List the student's tracked jobs
      responses:
        "200":
          description: Jobs tracked by the signed-in student
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/JobApplication" }
        "401": { description: Sign in required }
    post:
      operationId: createJobApplication
      tags: [jobs]
      summary: Track a job the student found
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobApplicationInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobApplication" }
        "400": { description: Invalid input }
        "401": { description: Sign in required }
  /me/jobs/{id}:
    patch:
      operationId: updateJobApplication
      tags: [jobs]
      summary: Update a tracked job
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JobApplicationInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobApplication" }
        "400": { description: Invalid input }
        "401": { description: Sign in required }
        "404": { description: Not found }
    delete:
      operationId: deleteJobApplication
      tags: [jobs]
      summary: Delete a tracked job
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "401": { description: Sign in required }
        "404": { description: Not found }
  /me/dashboard:
    get:
      operationId: getStudentDashboard
      tags: [student]
      summary: Get application dashboard summary
      responses:
        "200":
          description: Summary for the signed-in student
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
        "401": { description: Sign in required }
components:
  schemas:
    PublicInstitutionVerification:
      type: object
      required: [institutionId, fields]
      properties:
        institutionId: { type: string }
        fields: { type: array, items: { $ref: "#/components/schemas/AdminSourceField" } }
    AdminAccess:
      type: object
      required: [userId, isAdmin, canSetup, setupConfigured, environment]
      properties:
        userId: { type: string }
        isAdmin: { type: boolean }
        canSetup: { type: boolean }
        setupConfigured: { type: boolean }
        environment: { type: string }
    AdminSetupConfirmation:
      type: object
      required: [confirmed]
      properties:
        confirmed: { type: boolean, const: true }
    AdminDatabaseStatus:
      type: object
      required: [environment, databaseIdentity, checkedAt, institutionCount, uniqueInstitutionIds, programFacts, savedProfiles, pendingProposals, failedChecks, automaticChangesRequireReview]
      properties:
        environment: { type: string }
        databaseIdentity: { type: string }
        checkedAt: { type: string }
        institutionCount: { type: integer }
        uniqueInstitutionIds: { type: integer }
        programFacts: { type: integer }
        savedProfiles: { type: integer }
        pendingProposals: { type: integer }
        failedChecks: { type: integer }
        automaticChangesRequireReview: { type: boolean }
    AdminInstitutionSummary:
      type: object
      required: [id, name, country, website, dataSource, dataYear]
      properties:
        id: { type: string }
        name: { type: string }
        country: { type: string }
        website: { type: string }
        dataSource: { type: string }
        dataYear: { type: string }
    AdminInstitutionList:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AdminInstitutionSummary" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    AdminSourceField:
      type: object
      required: [fieldKey, title, value, status, sourceUrl, checkedAt, message]
      properties:
        fieldKey: { type: string }
        title: { type: string }
        value: { type: string }
        status: { type: string }
        sourceUrl: { type: ["string", "null"] }
        checkedAt: { type: ["string", "null"] }
        message: { type: string }
    AdminVerificationJob:
      type: object
      required: [id, institutionId, status, requestedAt, completedAt, error, checks]
      properties:
        id: { type: string }
        institutionId: { type: string }
        status: { type: string }
        requestedAt: { type: string }
        completedAt: { type: ["string", "null"] }
        error: { type: ["string", "null"] }
        checks: { type: array, items: { $ref: "#/components/schemas/AdminSourceField" } }
    AdminVerificationProposal:
      type: object
      required: [id, jobId, institutionId, fieldKey, value, previousValue, status, sourceUrl, checkedAt, reviewedAt, reviewNote]
      properties:
        id: { type: string }
        jobId: { type: string }
        institutionId: { type: string }
        fieldKey: { type: string }
        value: { type: string }
        previousValue: { type: ["string", "null"] }
        status: { type: string }
        sourceUrl: { type: string }
        checkedAt: { type: string }
        reviewedAt: { type: ["string", "null"] }
        reviewNote: { type: ["string", "null"] }
    AdminProposalDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        note: { type: string, maxLength: 1000 }
    AdminInstitutionDetail:
      type: object
      required: [institution, fields, jobs, proposals]
      properties:
        institution: { $ref: "#/components/schemas/AdminInstitutionSummary" }
        fields: { type: array, items: { $ref: "#/components/schemas/AdminSourceField" } }
        jobs: { type: array, items: { $ref: "#/components/schemas/AdminVerificationJob" } }
        proposals: { type: array, items: { $ref: "#/components/schemas/AdminVerificationProposal" } }
    InstitutionBrandingCoverage:
      type: object
      required: [total, logos, colors, mascots, mascotImages, campusImages, attempted, note]
      properties:
        total: { type: integer }
        logos: { type: integer }
        colors: { type: integer }
        mascots: { type: integer }
        mascotImages: { type: integer }
        campusImages: { type: integer }
        attempted: { type: integer }
        note: { type: string }
    InstitutionLogoCoverage:
      type: object
      required: [rows, note]
      properties:
        note: { type: string }
        rows:
          type: array
          items: { $ref: "#/components/schemas/InstitutionLogoCoverageRow" }
    InstitutionLogoCoverageRow:
      type: object
      required: [countryCode, status, count, lastCheckedAt]
      properties:
        countryCode: { type: string }
        status: { type: string }
        count: { type: integer }
        lastCheckedAt: { type: ["string", "null"] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    University:
      type: object
      required: [id, name, country, countryCode, city, state, institutionType, ownership, dataSource, dataYear, degreeLevels, degreeTypes, majors, website, admissionsWebsite, applicationWebsite, financialAidWebsite, admissionRate, admissionRateYear, completionRate, completionRateYear, completionRateType, pellGrantRate, pellGrantRateYear, medianDebtUsd, medianDebtYear, sourceUrl, isActive, lastUpdatedAt, sourceScope, sourceLicenseUrl, recognitionStatus, languages, applicantStatuses, dliNumber, dliSourceUrl, dliVerifiedAt, lastVerifiedAt]
      properties:
        id: { type: string }
        name: { type: string }
        country: { type: string }
        countryCode: { type: string }
        sourceScope: { type: ["string", "null"] }
        sourceLicenseUrl: { type: ["string", "null"] }
        recognitionStatus: { type: ["string", "null"] }
        languages: { type: array, items: { type: string } }
        applicantStatuses: { type: array, items: { type: string } }
        dliNumber: { type: ["string", "null"] }
        dliSourceUrl: { type: ["string", "null"] }
        dliVerifiedAt: { type: ["string", "null"], format: date-time }
        lastVerifiedAt: { type: ["string", "null"], format: date-time }
        city: { type: string }
        state: { type: string }
        institutionType: { type: string }
        ownership: { type: ["string", "null"] }
        dataSource: { type: string }
        dataYear: { type: ["string", "null"] }
        degreeLevels:
          type: array
          items: { type: string }
        degreeTypes:
          type: array
          items: { type: string }
        majors:
          type: array
          items: { type: string }
        website: { type: ["string", "null"] }
        admissionsWebsite: { type: ["string", "null"] }
        applicationWebsite: { type: ["string", "null"] }
        financialAidWebsite: { type: ["string", "null"] }
        logoUrl: { type: ["string", "null"], description: "Cached image URL, returned only for verified institution logos." }
        logoSource: { type: ["string", "null"] }
        logoIdentitySource: { type: ["string", "null"] }
        logoLicenseUrl: { type: ["string", "null"] }
        logoUsageNote: { type: ["string", "null"] }
        logoVerificationStatus: { type: string, enum: [not_checked, verified, review_required, not_found, missing_website, error] }
        logoLastCheckedAt: { type: ["string", "null"], format: date-time }
        logoSourceUrl: { type: ["string", "null"] }
        primaryColorHex: { type: ["string", "null"], pattern: '^#[0-9A-Fa-f]{6}$' }
        secondaryColorHex: { type: ["string", "null"], pattern: '^#[0-9A-Fa-f]{6}$' }
        colorsSourceUrl: { type: ["string", "null"] }
        colorsUsageNote: { type: ["string", "null"] }
        colorsVerificationStatus: { type: string }
        colorsLastVerifiedAt: { type: ["string", "null"], format: date-time }
        mascotName: { type: ["string", "null"] }
        mascotSourceUrl: { type: ["string", "null"] }
        mascotVerificationStatus: { type: string }
        mascotLastVerifiedAt: { type: ["string", "null"], format: date-time }
        mascotImageUrl: { type: ["string", "null"] }
        mascotImageSourceUrl: { type: ["string", "null"] }
        mascotImageLicenseUrl: { type: ["string", "null"] }
        mascotImageCredit: { type: ["string", "null"] }
        mascotImageVerificationStatus: { type: string }
        campusImageUrl: { type: ["string", "null"] }
        campusImageSourceUrl: { type: ["string", "null"] }
        campusImageLicenseUrl: { type: ["string", "null"] }
        campusImageCredit: { type: ["string", "null"] }
        campusImageVerificationStatus: { type: string }
        campusImageLastVerifiedAt: { type: ["string", "null"], format: date-time }
        brandingVerificationStatus: { type: string }
